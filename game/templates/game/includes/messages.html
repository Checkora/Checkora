{# Django messages. toast.js turns the confirmations into toasts; errors stay here. #}
{% if messages %}
<div class="messages" aria-live="polite">
    {% for message in messages %}
    <div class="notice alert notice--{{ message.level_tag }} alert-{{ message.level_tag }}" role="{% if message.level_tag == 'error' %}alert{% else %}status{% endif %}">{{ message }}</div>
    {% endfor %}
</div>
{% endif %}
